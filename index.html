<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Troféus</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body class="bg-light">

  <header class="bg-dark text-white py-4 mb-4 shadow">
    <div class="container text-center">
      <h1 class="display-5 fw-bold">🏆 Sala de Troféus</h1>
      <p class="lead mb-0">Compare a galeria de títulos de até 4 clubes do futebol brasileiro</p>
    </div>
  </header>

  <main class="container mb-5">
    <!-- Seletor de Times -->
    <section class="card shadow-sm p-4 mb-4 border-0">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0 text-secondary">Selecione até 4 times para comparar</h2>
        <button id="btn-limpar" class="btn btn-outline-danger btn-sm fw-bold px-3">
        🗑️ Limpar Seleção
        </button>
    </div>
    <div class="row g-3" id="select-container">
        <div class="col-md-3 col-6">
        <label for="time1" class="form-label fw-bold">Time 1</label>
        <select id="time1" class="form-select time-select" data-slot="0">
            <option value="">Selecione...</option>
        </select>
        </div>
        <div class="col-md-3 col-6">
        <label for="time2" class="form-label fw-bold">Time 2</label>
        <select id="time2" class="form-select time-select" data-slot="1">
            <option value="">Selecione...</option>
        </select>
        </div>
        <div class="col-md-3 col-6">
        <label for="time3" class="form-label fw-bold">Time 3</label>
        <select id="time3" class="form-select time-select" data-slot="2">
            <option value="">Selecione...</option>
        </select>
        </div>
        <div class="col-md-3 col-6">
        <label for="time4" class="form-label fw-bold">Time 4</label>
        <select id="time4" class="form-select time-select" data-slot="3">
            <option value="">Selecione...</option>
        </select>
        </div>
    </div>
    </section>

    <!-- Tabela Comparativa -->
    <section class="card shadow-sm border-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 text-center" id="trophy-table">
          <thead class="table-dark">
            <tr id="header-row">
              <th scope="col" class="text-start ps-4" style="width: 280px;">Competição</th>
              <!-- Colunas dos times injetadas via JS -->
            </tr>
          </thead>
          <tbody id="tbody-content">
            <!-- Conteúdo dinâmico gerado via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="src/js/times.js"></script>
  <script src="src/js/script.js"></script>
</body>
</html>
